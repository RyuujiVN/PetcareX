name: Infra Ansible Setup

on:
  push:
    branches: ["Deploy"]
    paths:
      - "ansible/**"
      - ".github/workflows/infra-ansible.yml"
  workflow_dispatch:
    inputs:
      limit:
        description: "Ansible --limit value (petcare_servers, vm1)"
        required: false
        default: "petcare_servers"
      dry_run:
        description: "Run in check mode only (no changes)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ansible-setup:
    name: Run Ansible Setup
    runs-on: ubuntu-latest

    env:
      ANSIBLE_HOST_KEY_CHECKING: "False"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        run: |
          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "Missing secret: ANSIBLE_SSH_PRIVATE_KEY"
            exit 1
          fi
          if [ -z "${{ secrets.ANSIBLE_INVENTORY }}" ]; then
            echo "Missing secret: ANSIBLE_INVENTORY"
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ansible
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install "ansible-core>=2.16,<2.18"
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Write SSH key and inventory
        shell: bash
        run: |
          mkdir -p .tmp
          printf "%s" "${{ secrets.SSH_PRIVATE_KEY }}" > .tmp/ansible_key.pem
          chmod 600 .tmp/ansible_key.pem

          printf "%s" "${{ secrets.ANSIBLE_INVENTORY }}" > .tmp/inventory.ini

      - name: Show inventory groups
        shell: bash
        run: |
          ansible-inventory -i .tmp/inventory.ini --graph

      - name: Run setup playbook
        shell: bash
        run: |
          EXTRA_ARGS=""
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --limit ${{ github.event.inputs.limit }}"
          fi

          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --check --diff"
          fi

          ansible-playbook -i .tmp/inventory.ini ansible/setup-docker.yml --private-key .tmp/ansible_key.pem $EXTRA_ARGS
