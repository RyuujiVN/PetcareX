name: Main CI/CD Pipeline

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "ansible/**"
      - ".github/workflows/infra-ansible.yml"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "ansible/**"
      - ".github/workflows/infra-ansible.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: docker.io

jobs:
  ci-fe:
    name: CI FE
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FE/Web/client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: FE/Web/client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build FE
        run: npm run build

  ci-be:
    name: CI BE
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BE/petcare

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: BE/petcare/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build BE
        run: npm run build

  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    needs: [ci-fe, ci-be]
    if: github.event_name == 'push' && github.ref == 'refs/heads/Deploy'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive lowercase owner and image names
        id: vars
        shell: bash
        run: |
          DOCKERHUB_USER="${{ secrets.DOCKERHUB_USERNAME }}"
          echo "fe_image=${{ env.REGISTRY }}/$DOCKERHUB_USER/petcarex-fe" >> "$GITHUB_OUTPUT"
          echo "be_image=${{ env.REGISTRY }}/$DOCKERHUB_USER/petcarex-be" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push FE image
        uses: docker/build-push-action@v6
        with:
          context: FE/Web/client
          file: FE/Web/client/Dockerfile
          push: true
          tags: |
            ${{ steps.vars.outputs.fe_image }}:latest
            ${{ steps.vars.outputs.fe_image }}:${{ github.sha }}

      - name: Build and push BE image
        uses: docker/build-push-action@v6
        with:
          context: BE/petcare
          file: BE/petcare/Dockerfile
          push: true
          tags: |
            ${{ steps.vars.outputs.be_image }}:latest
            ${{ steps.vars.outputs.be_image }}:${{ github.sha }}

  deploy:
    name: Deploy FE + BE + DB (Single VPS)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/Deploy'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive lowercase owner and image names
        id: vars
        shell: bash
        run: |
          DOCKERHUB_USER="${{ secrets.DOCKERHUB_USERNAME }}"
          echo "fe_image=${{ env.REGISTRY }}/$DOCKERHUB_USER/petcarex-fe" >> "$GITHUB_OUTPUT"
          echo "be_image=${{ env.REGISTRY }}/$DOCKERHUB_USER/petcarex-be" >> "$GITHUB_OUTPUT"

      - name: Ensure deploy folder exists on VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          script: |
            mkdir -p "${{ secrets.DEPLOY_PATH }}"

      - name: Copy stack compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          source: deploys/docker-compose.prod.yml
          target: ${{ secrets.DEPLOY_PATH }}
          strip_components: 1

      - name: Pull and run stack on VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          script: |
            set -e

            STACK_PATH="${{ secrets.DEPLOY_PATH }}"
            FE_IMAGE="${{ steps.vars.outputs.fe_image }}:${{ github.sha }}"
            BE_IMAGE="${{ steps.vars.outputs.be_image }}:${{ github.sha }}"

            mkdir -p "$STACK_PATH"

            cd "$STACK_PATH"
            {
              echo "FE_IMAGE=$FE_IMAGE"
              echo "BE_IMAGE=$BE_IMAGE"
            } > .env

            if [ -n "${{ secrets.STACK_ENV }}" ]; then
              printf "%s" "${{ secrets.STACK_ENV }}" >> .env
            fi

            if [ -n "${{ secrets.BE_APP_ENV }}" ]; then
              printf "%s" "${{ secrets.BE_APP_ENV }}" > .env.app
            fi

            docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" -p "${{ secrets.DOCKERHUB_TOKEN }}"

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
